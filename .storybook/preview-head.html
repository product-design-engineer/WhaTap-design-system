<!--
  Storybook Docs 전용 스타일 — **배포물(src/whatap-ds.css)에 넣지 않는다.**
  DS tarball 소비자에게 Storybook UI 스타일이 섞이면 안 되므로 preview-head 로만 주입.

  두 가지를 한다.
   ① 폭 — chrome 중심 DS 라 docs 안 프리뷰가 기본 1000px 컨테이너에서 잘린다.
   ② 조판 — 사람이 읽는 산문의 제목 위계 · 문단 · 불릿 들여쓰기 규칙.
-->
<style>
  /* ══════════════════════════════════════════════════════════════════════
     ① 폭 — 하이브리드
        산문(본문)은 읽기 폭 유지(1440px 캡). 한국어 설명 문단이 길어 전폭은 줄 길이가 과해진다.
        스토리 프리뷰 · props 표는 max-width 해제 → 화면 폭을 그대로 사용.
     ══════════════════════════════════════════════════════════════════════ */
  .sbdocs.sbdocs-content { max-width: 1440px; }

  .sbdocs .sbdocs-preview,
  .sbdocs .docs-story { max-width: none; }

  .sbdocs .docblock-argstable-body,
  .sbdocs table.docblock-argstable { max-width: none; }

  /* 넓은 표는 컨테이너 안에서만 스크롤 — 페이지 자체가 가로 스크롤되지 않게 */
  .sbdocs .docblock-argstable-wrapper { overflow-x: auto; }

  /* ══════════════════════════════════════════════════════════════════════
     ② 조판 — 제목 위계 · 문단 · 불릿

     원칙 셋.

     (a) **위계는 크기가 아니라 «간격»이 만든다.**
         제목 위 여백 ≫ 아래 여백. 제목이 아래 본문에 붙어 있어야 「이 제목의 내용」으로
         읽힌다. 위아래가 같으면 제목이 어느 덩어리에 속하는지 눈이 판단을 못 한다.

     (c) **읽기 폭은 컨테이너 폭과 다르다.**
         컨테이너는 1440px 이지만 산문은 그보다 좁아야 한다. 한 줄이 100자를 넘으면
         눈이 다음 줄 첫 글자를 못 찾는다(줄 되돌림 실패). 표·코드·프리뷰는 예외 —
         그건 훑는 것이지 읽는 것이 아니다.

     (b) **불릿은 들여쓰기로 계층을 말한다.**
         단계마다 마커가 바뀌고 들여쓰기가 늘어난다. 같은 모양이 반복되면 사람은
         2단계와 3단계를 구분하지 못한다.
     ══════════════════════════════════════════════════════════════════════ */

  /* ── 제목 ────────────────────────────────────────────────────────────── */

  /* H1 — 페이지당 하나. DS text-2xl(20px)과 정렬. */
  /* 아래 문서 서식은 Docs 본문(MDX · 설명)용이다. 스토리 미리보기(.sb-unstyled 안)에는 적용하지 않는다 —
     안 막으면 컴포넌트 안 <p> · <ul> · <h*> 의 줄 높이 · 여백을 덮어써 Docs 페이지에서만 정렬이 어긋난다
     (2026-10-22: SidebarMenuItem 라벨이 줄 높이 1.75 + 아래 여백 14px 를 받아 아이콘보다 7px 떴다). */
  .sbdocs.sbdocs-content h1:not(.sb-unstyled *) {
    font-size: var(--text-2xl);
    line-height: calc(2 / 1.5);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--color-border-default);
  }

  /* H2 — 장(章). DS text-xl(16px)과 정렬. */
  .sbdocs.sbdocs-content h2:not(.sb-unstyled *) {
    font-size: var(--text-xl);
    line-height: calc(1.75 / 1.25);
    font-weight: 700;
    letter-spacing: -0.005em;
    margin: 56px 0 14px;
  }

  /* H3 — 절(節). DS text-lg(14px)와 정렬. */
  .sbdocs.sbdocs-content h3:not(.sb-unstyled *) {
    font-size: var(--text-lg);
    line-height: calc(1.75 / 1.125);
    font-weight: 700;
    margin: 28px 0 10px;
  }

  /* H4 — 더 내려가면 제목이 아니라 문단 머리다. DS text-md(13px)와 정렬, 굵기로만 구분. */
  .sbdocs.sbdocs-content h4:not(.sb-unstyled *) {
    font-size: var(--text-md);
    line-height: 1.5;
    font-weight: 700;
    margin: 20px 0 6px;
  }

  /* 연속한 제목 사이에는 큰 여백이 필요 없다 — 사이에 본문이 없으므로 화제 전환이 아니다. */
  .sbdocs.sbdocs-content h2 + h3:not(.sb-unstyled *),
  .sbdocs.sbdocs-content h3 + h4:not(.sb-unstyled *) { margin-top: 12px; }

  /* 문서 첫 제목은 위 여백을 지운다(컨테이너 패딩과 이중이 된다). */
  .sbdocs.sbdocs-content > h1:first-child:not(.sb-unstyled *),
  .sbdocs.sbdocs-content > h2:first-child:not(.sb-unstyled *) { margin-top: 0; }

  /* ── 문단 ────────────────────────────────────────────────────────────── */

  .sbdocs.sbdocs-content p:not(.sb-unstyled *) {
    font-size: var(--text-md);  /* DS text-md(13px) — 본문은 제품 UI와 1단계 위. */
    line-height: 1.75;          /* 한국어는 라틴보다 자간이 빽빽해 행간이 더 필요하다. */
    margin: 0 0 14px;
    width: 100%;
  }

  /* ── 불릿 ────────────────────────────────────────────────────────────── */

  .sbdocs.sbdocs-content ul:not(.sb-unstyled *),
  .sbdocs.sbdocs-content ol:not(.sb-unstyled *) {
    margin: 0 0 16px;
    padding-left: 22px;         /* 마커가 본문 왼쪽 밖에 서도록 — 글줄 시작선이 가지런해진다. */
    width: 100%;
  }

  .sbdocs.sbdocs-content li:not(.sb-unstyled *) {
    font-size: var(--text-md);  /* p 와 동일 — DS text-md(13px). */
    line-height: 1.75;
    margin: 0 0 6px;            /* 항목 사이 숨 — 붙어 있으면 한 덩어리로 읽힌다. */
    padding-left: 2px;
  }

  /* 항목 안 문단은 위 여백을 지운다(마커와 첫 줄이 어긋난다). */
  .sbdocs.sbdocs-content li > p:not(.sb-unstyled *) { margin: 0 0 6px; width: 100%; }
  .sbdocs.sbdocs-content li > p:last-child:not(.sb-unstyled *) { margin-bottom: 0; }

  /* 중첩 — 단계마다 마커를 바꾼다. 같은 모양이 반복되면 깊이를 못 읽는다(원칙 b). */
  .sbdocs.sbdocs-content ul:not(.sb-unstyled *) { list-style-type: disc; }
  .sbdocs.sbdocs-content ul ul:not(.sb-unstyled *) { list-style-type: "– "; }
  .sbdocs.sbdocs-content ul ul ul:not(.sb-unstyled *) { list-style-type: "· "; }

  /* 중첩 목록은 위아래 여백을 줄인다 — 부모 항목에 붙어 있어야 그 항목의 하위로 읽힌다. */
  .sbdocs.sbdocs-content li > ul:not(.sb-unstyled *),
  .sbdocs.sbdocs-content li > ol:not(.sb-unstyled *) {
    margin: 6px 0 8px;
    padding-left: 20px;
  }

  /* ✅ / ❌ 로 시작하는 항목 — 마커를 지운다. 기호 자체가 마커다(불릿과 겹치면 둘이 싸운다). */
  .sbdocs.sbdocs-content li.wds-verdict:not(.sb-unstyled *) { list-style: none; margin-left: -22px; }

  /* ── 인용 · 보조 ─────────────────────────────────────────────────────── */

  /* blockquote — 본문 옆에 서는 주석. 좌측 띠로 «본문이 아님»을 말한다. */
  .sbdocs.sbdocs-content blockquote:not(.sb-unstyled *) {
    margin: 16px 0;
    padding: 2px 0 2px 16px;
    border-left: 3px solid var(--color-border-strong);
    color: var(--color-text-secondary);
    width: 100%;
  }
  .sbdocs.sbdocs-content blockquote p:last-child:not(.sb-unstyled *) { margin-bottom: 0; }

  /* 구분선 — 장 사이를 가르는 자리. 위아래 여백이 H2 의 위 여백과 겹치지 않게 한다. */
  .sbdocs.sbdocs-content hr:not(.sb-unstyled *) {
    margin: 48px 0 0;
    border: 0;
    border-top: 1px solid var(--color-border-soft);
  }
  .sbdocs.sbdocs-content hr + h2:not(.sb-unstyled *) { margin-top: 40px; }

  /* ── 표 · 코드 ───────────────────────────────────────────────────────── */

  /* 표 — DS text-md(13px)와 정렬, 전폭. */
  .sbdocs.sbdocs-content table:not(.docblock-argstable):not(.sb-unstyled *) {
    font-size: var(--text-md);
    line-height: 1.6;
    margin: 0 0 18px;
    width: 100%;
  }
  .sbdocs.sbdocs-content table:not(.docblock-argstable) th:not(.sb-unstyled *),
  .sbdocs.sbdocs-content table:not(.docblock-argstable) td:not(.sb-unstyled *) {
    padding: 8px 12px;
    vertical-align: top;
  }

  .sbdocs.sbdocs-content :not(pre) > code:not(.sb-unstyled *) {
    font-size: 0.92em;          /* 코드 폰트가 본문보다 커 보이는 것을 보정. */
    padding: 1px 5px;
  }

  .sbdocs.sbdocs-content pre:not(.sb-unstyled *) { margin: 0 0 18px; }
</style>
